<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SON — Snow Observations Network</title>
    <meta
      name="description"
      content="Live snowpack stations from NRCS, BC ASWS, and more — mapped via the Snow Observations Network API."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="top">
      <div class="brand-block">
        <p class="brand">SON</p>
        <p class="tagline">Snow Observations Network</p>
      </div>
      <div class="meta">
        <p id="status" class="status">Loading stations…</p>
        <a
          class="api-link"
          href="https://api.psithurismlabs.com/docs"
          target="_blank"
          rel="noopener"
          >API</a
        >
      </div>
    </header>

    <aside class="filters" aria-label="Station layers">
      <p class="filters__title">Layers</p>
      <div id="filter-list" class="filters__list"></div>
    </aside>

    <main id="map" class="map" role="application" aria-label="Snow station map"></main>

    <div id="modal" class="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <div
        class="modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button type="button" class="modal__close" data-close aria-label="Close">
          ×
        </button>
        <p class="modal__provider" id="modal-provider"></p>
        <h2 class="modal__title" id="modal-title"></h2>
        <p class="modal__id" id="modal-id"></p>
        <p class="modal__observed" id="modal-observed"></p>
        <dl class="readings" id="modal-readings"></dl>
        <p class="modal__error" id="modal-error" hidden></p>
        <a class="modal__api" id="modal-api" href="#" target="_blank" rel="noopener"
          >Open in API</a
        >
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./app.js"></script>
  </body>
</html>
